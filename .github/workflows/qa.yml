name: QA

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      # Before the tests, because it is the cheapest check here and it guards
      # a failure neither the tests nor `next build` can see: a dynamic page
      # is never prerendered, so a server component reading a value out of a
      # client module builds green and dies on the first request.
      - run: npm run check:rsc
      - run: npm run test:ci
      - run: npm run compile
